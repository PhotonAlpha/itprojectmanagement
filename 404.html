<style>
  :root { --c-blue-800:#123a6b; --c-bg:#f5f7fa; --c-surface:#fff;
          --c-border:#d7dee8; --c-text:#16202e; --c-muted:#5b6879; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--c-bg); color:var(--c-text); padding:24px;
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
              Helvetica, Arial, sans-serif; }
  .card { background:var(--c-surface); border:1px solid var(--c-border);
          border-radius:10px; padding:32px; max-width:520px; text-align:center; }
  h1 { margin:0 0 8px; font-size:20px; color:var(--c-blue-800); }
  p { margin:0 0 24px; color:var(--c-muted); }
  a { display:inline-block; background:var(--c-blue-800); color:#fff;
      text-decoration:none; padding:10px 20px; border-radius:6px;
      font-weight:600; }
  a:focus-visible { outline:3px solid #2266b3; outline-offset:2px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Page not found</h1>
    <p>That address doesn&rsquo;t exist on this site. The board lives at the root.</p>
    <!-- Resolved at runtime so the link is correct under the
         /<repo-name>/ project-page base path. -->
    <a id="home" href="/">Back to the Kanban board</a>
  </main>
  <script>
    var seg = location.pathname.split('/')[1];
    document.getElementById('home').href = seg ? '/' + seg + '/' : '/';
  </script>
</body>
